<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FocusFlow – Task Timer with Notes & Priorities</title>
  <link rel="stylesheet" href="./styles.css" />
  <!-- NEW: Quill.js CSS for Rich Text Editor -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="script.js"></script>
</head>
<body>

  <nav id="main-navbar">
    <div class="nav-left">
      <h1 class="nav-title">FocusFlow</h1>
    </div>

  <div class="nav-right"> 
  <div class="nav-right"> 
    <button id="themeToggle" class="nav-button theme-toggle" aria-pressed="false" aria-label="Toggle theme">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6" aria-hidden="true">
        <path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.758 17.303a.75.75 0 0 0-1.061-1.06l-1.591 1.59a.75.75 0 0 0 1.06 1.061l1.591-1.59ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.697 7.757a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.061 1.06l1.59 1.591Z" />
      </svg>
    </button>
      <button id="toggleNotes" class="nav-button notes-toggle" aria-label="Toggle notes sidebar">  
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
          <path d="M21.731 2.269a2.625 2.625 0 0 0-3.712 0l-1.157 1.157 3.712 3.712 1.157-1.157a2.625 2.625 0 0 0 0-3.712ZM19.513 8.199l-3.712-3.712-8.4 8.4a5.25 5.25 0 0 0-1.32 2.214l-.8 2.685a.75.75 0 0 0 .933.933l2.685-.8a5.25 5.25 0 0 0 2.214-1.32l8.4-8.4Z" />
          <path d="M5.25 5.25a3 3 0 0 0-3 3v10.5a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3V13.5a.75.75 0 0 0-1.5 0v5.25a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5V8.25a1.5 1.5 0 0 1 1.5-1.5h5.25a.75.75 0 0 0 0-1.5H5.25Z" />
        </svg>
      </button>
      <!-- NEW: Goals Toggle Button -->
      <button id="toggleGoals" class="nav-button goals-toggle" aria-label="Toggle goals section">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
  <path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25Zm0 1.5a8.25 8.25 0 1 0 0 16.5 8.25 8.25 0 0 0 0-16.5ZM12 6a6 6 0 1 0 0 12 6 6 0 0 0 0-12Zm0 1.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 2.25a2.25 2.25 0 1 0 0 4.5 2.25 2.25 0 0 0 0-4.5Z" clip-rule="evenodd" />
</svg>
      </button>
      <span id="userEmailDisplay" class="user-email">Guest Mode</span>
      <div id="auth-nav-items">
        <input type="email" id="emailInput" placeholder="Email" class="nav-input" />
        <input type="password" id="passwordInput" placeholder="Password" class="nav-input" />
        <button id="signInBtn" class="nav-button">Sign In</button>
        <button id="signUpBtn" class="nav-button">Sign Up</button>
        <button id="sendResetEmailBtn" class="nav-button">Forgot Password?</button>
      </div>

      <div id="user-nav-items" style="display: none;">
        <button id="logoutBtn" class="nav-button">Logout</button>
      </div>  
    </div>
  </nav>

 <div id="mainContent">
    <div class="grid-container"> 
        <div class="timer-add-section grid-item pomodoro-card">
            <div id="timer-section">
                <div class="pomodoro-modes" role="tablist" aria-label="Timer mode">
                    <button type="button" id="pomodoroButton" class="mode-button active" data-mode="pomodoro">Focus</button>
                    <button type="button" id="shortBreakButton" class="mode-button" data-mode="short">Short Break</button>
                    <button type="button" id="longBreakButton" class="mode-button" data-mode="long">Long Break</button>
                </div>

                <div class="pomodoro-ring-wrap">
                    <svg class="pomodoro-ring" viewBox="0 0 200 200" aria-hidden="true">
                        <circle class="pomodoro-ring-bg" cx="100" cy="100" r="88" />
                        <circle id="timerRingProgress" class="pomodoro-ring-progress" cx="100" cy="100" r="88" />
                    </svg>
                    <div class="pomodoro-ring-content">
                        <div id="timer">25:00</div>
                        <span id="timerSessionLabel" class="pomodoro-session-label">Focus Session</span>
                    </div>
                </div>

                <div class="timer-controls">
                    <input type="number" id="timeInput" class="input" value="25" min="1" title="Custom minutes" />
                    <button id="setButton" class="button button-secondary">Set</button>
                    <button id="startButton" class="button">Start</button>
                    <button id="pauseButton" class="button" style="display:none;">Pause</button>
                    <button id="stopButton" class="button button-secondary">Reset</button>
                </div>

                <div class="input-field timer-task-link">
                    <label for="timerTaskSelect" class="sr-only">Focus on task</label>
                    <select id="timerTaskSelect" class="select-box" aria-label="Link timer to a task">
                        <option value="none">🔗 No task linked</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="task-add-section grid-item">
            <div class="task-input-group">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Add a new task..."
                    class="input"
                />
                <input type="file" id="newAttachmentInput" class="input file-input" multiple style="display: none;">
                <button id="triggerNewAttachmentInput" class="button">🗂️</button>
                <button id="addTaskButton" class="button">Add Task</button>
            </div>
            <div id="newAttachmentsDisplay" class="attachments-display"></div>


            <div class="task-details-row">
                <div class="input-field">
                    <label for="categorySelect"></label>
                    <select id="categorySelect" class="select-box" aria-label="Select task category">
                        <option value="Personal">Personal</option>
                        <option value="Home">Home</option>
                        <option value="Work">Work</option>
                        <option value="Health">Health</option>
                        <option value="Finance">Finance</option>
                        <option value="__custom__">Add New Category…</option>
                    </select>
                </div>
                <div class="input-field">
                    <label for="prioritySelect"></label>
                    <select id="prioritySelect" class="select-box" aria-label="Select task priority">
                        <option value="Scheduled">Scheduled</option>
                        <option value="Urgent">Urgent</option>
                        <option value="High">High</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Low">Low</option>
                        <option value="__custom__">Add New Priority…</option>
                    </select>
                </div>
                <div class="input-field">
                    <label for="dueDate"></label>
                    <input type="date" id="dueDate" class="date-input" title="Set due date" />
                </div>
                <div class="input-field">
                    <label for="dueTime"></label>
                    <input type="time" id="dueTime" class="time-input" title="Set due time" />
                </div>
            </div>
            <!-- NEW: Recurrence + Goal settings for Add Task, combined into one compact row -->
            <div class="task-details-row meta-row">
                <div class="input-field">
                    <label for="recurrenceType">Repeats:</label>
                    <select id="recurrenceType" class="select-box">
                        <option value="none">Never</option>
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                    </select>
                </div>
                <div class="input-field">
                    <label for="goalSelect">Link to Goal:</label>
                    <select id="goalSelect" class="select-box">
                        <option value="none">No Goal</option>
                        <!-- Options populated by script.js -->
                    </select>
                </div>
                <div id="recurrenceDetails" class="input-field recurrence-details-container" style="display: none;">
                    <!-- Content will be dynamically loaded here based on recurrenceType -->
                </div>
            </div>
            <!-- END NEW: Recurrence + Goal settings for Add Task -->
        </div>
    </div> 
    
    <!-- NEW: Tasks Panel — filters, counter and list combined into one compact section -->
    <section id="tasksPanel" class="task-add-section tasks-panel">
        <div class="filter-controls">
            <div class="input-field">
                <label for="categoryFilter">Category</label>
                <select id="categoryFilter" class="select-box">
                    <option value="all">All Categories</option>
                    <!-- Options will be dynamically populated by script.js -->
                </select>
            </div>

            <div class="input-field">
                <label for="priorityFilter">Priority</label>
                <select id="priorityFilter" class="select-box">
                    <option value="all">All Priorities</option>
                    <!-- Options will be dynamically populated by script.js -->
                </select>
            </div>

            <div class="input-field">
                <label for="sortOrder">Sort By</label>
                <select id="sortOrder" class="select-box">
                    <option value="creationDateDesc">Newest First</option>
                    <option value="dueDateAsc">Due Date ↑</option>
                    <option value="dueDateDesc">Due Date ↓</option>
                    <option value="priorityHighToLow">Priority ↓</option>
                    <option value="priorityLowToHigh">Priority ↑</option>
                    <option value="alphabeticalAsc">A-Z</option>
                    <option value="alphabeticalDesc">Z-A</option>
                </select>
            </div>
            <!-- NEW: Goal Filter for Tasks -->
            <div class="input-field">
                <label for="goalFilter">Goal</label>
                <select id="goalFilter" class="select-box">
                    <option value="all">All Goals</option>
                    <option value="no-goal">No Goal</option>
                    <!-- Options populated by script.js -->
                </select>
            </div>
            <!-- END NEW: Goal Filter for Tasks -->

            <div class="input-field checkbox-field">
                <input type="checkbox" id="showCompleted">
                <label for="showCompleted">Show Completed</label>
            </div>

            <div class="input-field">
                <label class="sr-only" for="clearFiltersButton">Clear filters</label>
                <button id="clearFiltersButton" class="button button-secondary">Clear</button>
            </div>
        </div>

        <div id="taskCountToday" class="task-counter-line">
            <div class="task-counter-content">
                <div class="counter-text">
                    <span class="count">0</span>
                </div>

                <div class="task-actions">
                  <input type="text" id="searchInput" placeholder="Search tasks..." class="nav-input search-input" aria-label="Search tasks">
                    <button id="clearFinishedBtn" class="reset-button">Clear Done</button>
                    <button id="resetCountBtn" class="reset-button">Reset All</button>
                </div>
            </div>
        </div>

        <ul id="taskList"></ul>
    </section>
    <!-- END NEW: Tasks Panel -->

    <!-- NEW: Goals Section -->
    <section id="goalsSection" class="task-add-section" style="display: none;">
        <div class="goals-header">
            <h2 class="goals-title">🏆 Goals</h2>
        </div>
        <div class="goals-controls">
            <div class="input-field">
                <label for="goalStatusFilter" class="sr-only">Filter by Status:</label>
                <select id="goalStatusFilter" class="select-box">
                    <option value="all">All Statuses</option>
                    <option value="active">Active</option>
                    <option value="completed">Completed</option>
                    <option value="archived">Archived</option>
                </select>
            </div>
            <div class="input-field">
                <label for="goalSortOrder" class="sr-only">Sort Goals By:</label>
                <select id="goalSortOrder" class="select-box">
                    <option value="dueDateAsc">Due Date (Earliest)</option>
                    <option value="creationDateDesc">Newest First</option>
                    <option value="alphabeticalAsc">A-Z</option>
                    <option value="custom">My Order (Drag &amp; Drop)</option>
                </select>
            </div>
            <input type="text" id="goalSearchInput" placeholder="Search goals..." class="input goal-search-input" aria-label="Search goals">
            <button id="addNewGoalButton" class="button">Add New Goal</button>
        </div>
        <ul id="goalList" class="goal-list">
            <!-- Goals will be rendered here by JavaScript -->
        </ul>
        <p id="noGoalsMessage" class="empty-state" style="display: none;">No goals found. Click "Add New Goal" to create one!</p>
    </section>
    <!-- END NEW: Goals Section -->
</div>
  <!-- START NEW: Notes Sidebar with Rich Editor and Multiple Notes -->
  <div id="notesSidebar" class="notes-sidebar">
    <div class="notes-header">
      <h2 class="notes-title"><span class="circle-icon">📒</span> Notes</h2>
      <button id="closeNotes" class="close-button" aria-label="Close notes">X</button>
    </div>

    <div class="notes-controls">
      <input type="text" id="noteSearchInput" placeholder="Search notes..." class="input note-search-input" aria-label="Search notes">
      <div class="input-field note-category-filter-field">
          <label for="noteCategoryFilter" class="sr-only">Filter by Note Category:</label>
          <select id="noteCategoryFilter" class="select-box">
              <option value="all">All Categories</option>
              <option value="General">General</option>
              <option value="Ideas">Ideas</option>
              <option value="Meeting">Meeting</option>
              <option value="Project">Project</option>
              <option value="Personal">Personal</option>
              <option value="__custom__">Add New Category…</option>
          </select>
      </div>
      <div class="note-action-buttons">
        <button id="newNoteButton" class="button">New Note</button>
        <button id="deleteNoteButton" class="button button-secondary" disabled>Delete Note</button>
      </div>
    </div>

    <div id="note-list-container" class="note-list-container">
      <!-- Note titles will be rendered here by JavaScript -->
    </div>

    <div class="note-editor-area">
      <input type="text" id="noteTitleInput" placeholder="Note Title" class="input note-title-input" />
      <div class="input-field">
          <label for="noteCategorySelect" class="sr-only">Note Category:</label>
          <select id="noteCategorySelect" class="select-box">
              <option value="General">General</option>
              <option value="Ideas">Ideas</option>
              <option value="Meeting">Meeting</option>
              <option value="Project">Project</option>
              <option value="Personal">Personal</option>
              <option value="__custom__">Add New Category…</option>
          </select>
      </div>
      <!-- Quill.js editor container -->
      <div id="notes-editor" class="notes-editor"></div>
      <button id="saveNoteButton" class="button">Save Note</button>
    </div>
  </div>
  <!-- END NEW: Notes Sidebar with Rich Editor and Multiple Notes -->

  <audio id="timerEndSound" src="./notification-sound-effect-372475.mp3" preload="auto"></audio>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- NEW: Quill.js Library -->
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script type="module" src="./supabase-init.js"></script>
  <script type="module" src="./script.js"></script>

  <!-- NEW: Task Edit Modal -->
  <div id="editTaskModal" class="modal">
    <div class="modal-content">

      <h2>Edit Task</h2>
      <input type="hidden" id="editTaskId">
      <div class="input-field">
        <label for="editTaskContent">Task:</label>
        <input type="text" id="editTaskContent" class="input">
      </div>
      <div class="task-details-row">
          <div class="input-field">
              <label for="editCategorySelect">Category:</label>
              <select id="editCategorySelect" class="select-box">
                  <option value="Personal">Personal</option>
                  <option value="Home">Home</option>
                  <option value="Work">Work</option>
                  <option value="Health">Health</option>
                  <option value="Finance">Finance</option>
                  <option value="__custom__">Add New Category…</option>
              </select>
          </div>
          <div class="input-field">
              <label for="editPrioritySelect">Priority:</label>
              <select id="editPrioritySelect" class="select-box">
                  <option value="Scheduled">Scheduled</option>
                  <option value="Urgent">Urgent</option>
                  <option value="High">High</option>
                  <option value="Medium">Medium</option>
                  <option value="Low">Low</option>
                  <option value="__custom__">Add New Priority…</option>
              </select>
          </div>
          <div class="input-field">
              <label for="editDueDate">Date:</label>
              <input type="date" id="editDueDate" class="date-input">
          </div>
          <div class="input-field">
              <label for="editDueTime">Time:</label>
              <input type="time" id="editDueTime" class="time-input">
          </div>
          <div class="input-field">
              <label for="editNotificationOffset">Notify (mins before):</label>
              <input type="number" id="editNotificationOffset" class="input" min="0" placeholder="e.g. 15">
          </div>
      </div>
      <!-- NEW: Recurrence + Goal settings for Edit Task Modal, combined into one compact row -->
      <div class="task-details-row meta-row">
          <div class="input-field">
              <label for="editRecurrenceType">Repeats:</label>
              <select id="editRecurrenceType" class="select-box">
                  <option value="none">Never</option>
                  <option value="daily">Daily</option>
                  <option value="weekly">Weekly</option>
                  <option value="monthly">Monthly</option>
                  <option value="yearly">Yearly</option>
              </select>
          </div>
          <div class="input-field">
              <label for="editGoalSelect">Link to Goal:</label>
              <select id="editGoalSelect" class="select-box">
                  <option value="none">No Goal</option>
                  <!-- Options populated by script.js -->
              </select>
          </div>
          <div id="editRecurrenceDetails" class="input-field recurrence-details-container" style="display: none;">
              <!-- Content will be dynamically loaded here based on recurrenceType -->
          </div>
      </div>
      <!-- END NEW: Recurrence + Goal settings for Edit Task Modal -->
      <!-- NEW: Attachment input for Edit Task Modal -->
      <div class="input-field attachment-input-group">
          <label for="editAttachmentInput">Attachments:</label>
          <input type="file" id="editAttachmentInput" class="input file-input" multiple>
          <div id="currentAttachmentsDisplay" class="attachments-display"></div>
      </div>
      <!-- END NEW: Attachment input for Edit Task Modal -->
      <div class="modal-buttons"> 
        <button id="saveEditButton" class="button">Save</button>
        <button id="cancelEditButton" class="button button-secondary">Cancel</button>
      </div>
    </div>
  </div>
  <!-- END NEW: Task Edit Modal -->

  <!-- NEW: Goal Add/Edit Modal -->
  <div id="goalModal" class="modal">
    <div class="modal-content">
      <h2><span id="goalModalTitle">Add New Goal</span></h2>
      <input type="hidden" id="goalId">
      <div class="input-field">
        <label for="goalTitle">Goal Title:</label>
        <input type="text" id="goalTitle" class="input" placeholder="e.g., Learn a new language">
      </div>
      <div class="input-field">
        <label for="goalDescription">Description:</label>
        <textarea id="goalDescription" class="input" placeholder="Detailed description of your goal..."></textarea>
      </div>
      <div class="task-details-row">
          <div class="input-field">
              <label for="goalStartDate">Start Date:</label>
              <input type="date" id="goalStartDate" class="date-input">
          </div>
          <div class="input-field">
              <label for="goalDueDate">Due Date:</label>
              <input type="date" id="goalDueDate" class="date-input">
          </div>
          <div class="input-field">
              <label for="goalStatus">Status:</label>
              <select id="goalStatus" class="select-box">
                  <option value="active">Active</option>
                  <option value="completed">Completed</option>
                  <option value="archived">Archived</option>
              </select>
          </div>
      </div>
      <div class="modal-buttons">
        <button id="saveGoalButton" class="button">Save Goal</button>
        <button id="cancelGoalButton" class="button button-secondary">Cancel</button>
      </div>
      <button id="closeGoalModal" class="close-button" aria-label="Close goal modal">X</button>
    </div>
  </div>
  <!-- END NEW: Goal Add/Edit Modal -->

</body>
</html>
